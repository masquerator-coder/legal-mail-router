<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token_value(request) }}">
    <title>登录 — {{ system_name }}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
            max-width: 92vw;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 32px 32px 24px;
            text-align: center;
        }
        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px;
        }
        .login-header .subtitle {
            font-size: 13px;
            opacity: 0.85;
        }
        .login-body {
            padding: 32px;
        }
        .login-body .form-group {
            margin-bottom: 20px;
        }
        .login-body label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .login-body .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .login-body .form-control:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .login-btn:hover {
            opacity: 0.92;
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-error {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .login-footer {
            text-align: center;
            padding: 0 32px 24px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>⚖️ {{ system_name }}</h1>
            <div class="subtitle">Legal Mail Router</div>
        </div>
        <div class="login-body">
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                {{ csrf_token_input(request)|safe }}
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username"
                           class="form-control" value="admin"
                           placeholder="admin" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password"
                           class="form-control" placeholder="请输入密码"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">登 录</button>
            </form>
        </div>
        <div class="login-footer">
            默认用户名：admin · 首次登录后请修改密码
        </div>
    </div>

    <script>
    // 登录按钮防连点
    document.querySelector('form').addEventListener('submit', function() {
        var btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = '登录中...';
    });
    </script>
</body>
</html>
