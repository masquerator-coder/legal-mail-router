# 文书类型清单
# 每行一个文书类型。系统启动时会读取本文件作为「文书类型识别」阶段的候选类型清单,
# 并根据类型名在 `分析提示词/` 目录下查找对应的分析流程提示词。
#
# 说明:
# - 「其他法律文书」「非法律文书」为系统兜底类型,不可删除(若缺失,系统会自动补齐);
# - 「非法律文书」无需分析提示词文件(识别后直接跳过分析阶段);
# - 新增业务类型时,请同时在本文件追加一行,并在 `分析提示词/` 下新建同名 `.md` 文件,
#   否则会回退到「其他法律文书」的分析提示词。
#
# ── 类型能力开关(核心配置) ──────────────────────────────────────────────
# 在类型名后以 `#标记` 声明该类型具备的能力(可叠加,顺序不限):
#
#   #修订   生成「修改版文书.docx」。提示词要求该类型必须输出 revised_document。
#   #审查   生成审查意见.docx。提示词要求该类型输出审查意见正文。
#   #合同   审查意见使用「合同审核意见模板」(合同专用字段:当事人/合同价款等)。
#           未标 #合同 但标了 #审查 的类型,使用通用「律师审查意见模板」。
#
# 标记与类型名之间用空格分隔。`#` 后无空格也识别(如 `合同协议#修订`)。
# 这些开关**只由本文件决定**,代码中不维护任何文书类型清单。
#
# 关于 #审查 的取舍:
# - 判决书/裁定书/传票等由法院、仲裁机构出具的裁判文书与程序性告知,律师无权修改,
#   也不存在"审查对方文书"的立场,故**不加 #审查**(不加 #修订)。
# - 我方起草或我方可对外出具的文书(合同、起诉状、律师函、答复类文书等),
#   律师审查有意义,可按需加 #审查 / #修订。
#
# 示例:
#   合同协议   #修订 #审查 #合同
#   起诉状     #修订 #审查
#   判决书
#
合同协议      #修订 #审查 #合同
起诉状        #修订 #审查
判决书
裁定书
传票
律师函        #修订 #审查
证据材料
通知书        #审查
政府信息公开  #修订 #审查
信访件        #修订 #审查
其他法律文书  #审查
非法律文书