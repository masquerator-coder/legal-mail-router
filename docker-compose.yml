services:
  legal-mail-router:
    build: .
    container_name: legal-mail-router
    restart: unless-stopped
    # 端口映射跟随 PORT 环境变量（默认 8020），与容器内监听端口保持一致
    ports:
      - "${PORT:-8020}:${PORT:-8020}"
    volumes:
      # 生产只挂载数据目录；容器内代码来自镜像构建，勿挂载整个项目目录
      # 注意：容器以非 root 用户 (uid 10001) 运行，宿主 data/ 需可写：
      #   chown -R 10001:10001 data/
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=${PORT:-8020}
    # 健康检查已在 Dockerfile 中定义，此处不重复
