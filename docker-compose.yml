version: "3.8"

services:
  legal-mail-router:
    build: .
    container_name: legal-mail-router
    restart: unless-stopped
    ports:
      - "8020:8020"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=${PORT:-8020}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ.get(\\\"PORT\\\", \\\"8020\\\")}/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
