[project]
name = "legal-mail-router"
version = "2.0.0"
description = "邮件智能分析转发系统 (Legal Mail Router)"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.109.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "sqlalchemy>=2.0.25,<3.0",
    "jinja2>=3.1.3,<4.0",
    "python-multipart>=0.0.6,<1.0",
    "apscheduler>=3.10.4,<4.0",
    "httpx>=0.26.0,<1.0",
    "cryptography>=41.0.0,<50.0",
    "itsdangerous>=2.1.0,<3.0",
    "python-docx>=1.0.0,<1.3",
    "pymupdf>=1.23.0,<2.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "olefile>=0.46,<1.0",
    "openpyxl>=3.1.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "tiktoken>=0.5.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
