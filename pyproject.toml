[project]
name = "legal-mail-router"
version = "1.0.0"
description = "AI法律文书分发系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
    "apscheduler>=3.10.4",
    "httpx>=0.26.0",
    "cryptography>=41.0.0",
    "itsdangerous>=2.1.0",
    "python-docx>=1.0.0",
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "olefile>=0.46",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
